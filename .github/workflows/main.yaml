name: Test

permissions:
  contents: read
  issues: write
  pull-requests: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Update pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run lint
        run: |
          autoflake --check --recursive .
          isort --check-only .
          black --check .
          flake8 .
          mypy src

  test:
    needs: lint
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Update pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -q > pytest-output.txt 2>&1
          cat pytest-output.txt

      - name: Comment test failure
        if: ${{ steps.tests.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          pull_request = event["pull_request"]["number"]
          repository = os.environ["GITHUB_REPOSITORY"]
          with open("pytest-output.txt", encoding="utf-8", errors="replace") as output_file:
              output = output_file.read()[-6000:]

          body = "CI pytest failure output:\\n\\n```text\\n" + output + "\\n```"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/{pull_request}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(request)
          PY

      - name: Fail test job
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1

  release:
    needs: test
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pip
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Build package
        run: |
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
